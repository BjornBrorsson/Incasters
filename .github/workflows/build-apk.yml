name: Build & Release Signed Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Compile TypeScript & Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Prepare Release Signing Keystore
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using repository secret for keystore."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Generating production release signing keystore..."
            keytool -genkey -v -keystore android/app/release.keystore -alias incasters-key -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass incastersrelease -keypass incastersrelease \
              -dname "CN=Incasters, OU=Game Studio, O=Incasters, L=Stockholm, ST=Stockholm, C=SE"
            echo "KEYSTORE_PASSWORD=incastersrelease" >> $GITHUB_ENV
            echo "KEY_ALIAS=incasters-key" >> $GITHUB_ENV
            echo "KEY_PASSWORD=incastersrelease" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Signed Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify Signed Release APK
        run: |
          ls -la android/app/build/outputs/apk/release/
          test -f android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk ./Incasters-release.apk

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Incasters-release-apk
          path: Incasters-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Incasters v1.0.{0} (Release)', github.run_number) }}
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
          files: |
            Incasters-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
