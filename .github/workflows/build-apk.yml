name: Build & Release Android APK + Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certification-quality-gate:
    name: 🏆 Publisher Certification & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Run Unit Tests & Publisher Certification Matrix
        run: npm test

      - name: Upload Certification Compliance Report & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Publisher-Certification-Report
          path: |
            certification-report.json
            certification-report.md
            screenshots/cert/
          retention-days: 30

  build-android:
    name: Build Signed Android Release APK
    runs-on: ubuntu-latest
    needs: [certification-quality-gate]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Compile TypeScript & Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Prepare Release Signing Keystore
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using repository secret for keystore."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Using persistent repository release signing keystore..."
            echo "KEYSTORE_PASSWORD=incastersrelease" >> $GITHUB_ENV
            echo "KEY_ALIAS=incasters-key" >> $GITHUB_ENV
            echo "KEY_PASSWORD=incastersrelease" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Signed Android Release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Android Release Asset
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk ./Incasters-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Incasters-Android
          path: Incasters-Android.apk
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows Portable EXE
    runs-on: windows-latest
    needs: [certification-quality-gate]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows Portable Executable
        run: npm run desktop:build

      - name: Prepare Windows Release Asset
        shell: pwsh
        run: |
          $exe = Get-ChildItem "release/windows/Incasters-*-Windows-x64.exe" | Select-Object -First 1
          if (-not $exe) { throw "Windows portable executable was not created." }
          Copy-Item $exe.FullName "Incasters-Windows-x64.exe"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Incasters-Windows
          path: Incasters-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish Combined GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-windows
    if: github.event_name != 'pull_request' && needs.build-android.result == 'success' && needs.build-windows.result == 'success'

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Incasters-Android
          path: release-assets

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: Incasters-Windows
          path: release-assets

      - name: Verify Release Assets
        run: |
          test -f release-assets/Incasters-Android.apk
          test -f release-assets/Incasters-Windows-x64.exe
          ls -lh release-assets

      - name: Create GitHub Release with Android and Windows Builds
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Incasters v1.0.{0} (Release)', github.run_number) }}
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
          files: |
            release-assets/Incasters-Android.apk
            release-assets/Incasters-Windows-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
