name: Build & Release Android APK, Windows EXE & Firebase Web

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  certification-quality-gate:
    name: 🏆 Publisher Certification & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Run Unit Tests & Publisher Certification Matrix
        run: npm test

      - name: Upload Certification Compliance Report & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Publisher-Certification-Report
          path: |
            certification-report.json
            certification-report.md
            screenshots/cert/
          retention-days: 30

  build-android:
    name: Build Signed Android Release APK
    runs-on: ubuntu-latest
    needs: [certification-quality-gate]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Compile TypeScript & Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Prepare Release Signing Keystore
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using repository secret for keystore."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Using persistent repository release signing keystore..."
            echo "KEYSTORE_PASSWORD=incastersrelease" >> $GITHUB_ENV
            echo "KEY_ALIAS=incasters-key" >> $GITHUB_ENV
            echo "KEY_PASSWORD=incastersrelease" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Signed Android Release APK & App Bundle
        env:
          VERSION_CODE: ${{ github.run_number }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Prepare Android Release Assets
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          test -f android/app/build/outputs/bundle/release/app-release.aab
          cp android/app/build/outputs/apk/release/app-release.apk ./Incasters-Android.apk
          cp android/app/build/outputs/bundle/release/app-release.aab ./Incasters-Android.aab

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Incasters-Android
          path: Incasters-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android AAB (Google Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: Incasters-Android-AAB
          path: Incasters-Android.aab
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows Portable EXE
    runs-on: windows-latest
    needs: [certification-quality-gate]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows Portable Executable
        run: npm run desktop:build

      - name: Prepare Windows Release Asset
        shell: pwsh
        run: |
          $exe = Get-ChildItem "release/windows/Incasters-*-Windows-x64.exe" | Select-Object -First 1
          if (-not $exe) { throw "Windows portable executable was not created." }
          Copy-Item $exe.FullName "Incasters-Windows-x64.exe"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Incasters-Windows
          path: Incasters-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30

  deploy-firebase:
    name: Build & Deploy Web to Firebase Hosting
    runs-on: ubuntu-latest
    needs: [certification-quality-gate]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Compile TypeScript & Build Web Assets
        run: npm run build

      - name: Package Web Distribution ZIP
        run: |
          cd dist
          zip -r ../Incasters-Web.zip .
          cd ..

      - name: Upload Web Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Incasters-Web
          path: Incasters-Web.zip
          if-no-files-found: error
          retention-days: 30

      - name: Deploy to Firebase Hosting (Live Channel)
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_SERVICE_ACCOUNT_INCASTERS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INCASTERS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_INCASTERS" ]; then
            echo "Deploying to Firebase Hosting via FIREBASE_SERVICE_ACCOUNT_INCASTERS..."
            echo "$FIREBASE_SERVICE_ACCOUNT_INCASTERS" > service-account.json
            trap 'rm -f service-account.json' EXIT
            GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/service-account.json npx -y firebase-tools@latest deploy --only hosting --project incasters --non-interactive
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Deploying to Firebase Hosting via FIREBASE_SERVICE_ACCOUNT..."
            echo "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
            trap 'rm -f service-account.json' EXIT
            GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/service-account.json npx -y firebase-tools@latest deploy --only hosting --project incasters --non-interactive
          elif [ -n "$FIREBASE_TOKEN" ]; then
            if [[ "$FIREBASE_TOKEN" == *"service_account"* || "$FIREBASE_TOKEN" == *"private_key"* ]]; then
              echo "Detected service account JSON in FIREBASE_TOKEN secret. Deploying via GOOGLE_APPLICATION_CREDENTIALS..."
              echo "$FIREBASE_TOKEN" > service-account.json
              trap 'rm -f service-account.json' EXIT
              GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/service-account.json npx -y firebase-tools@latest deploy --only hosting --project incasters --non-interactive
            elif decoded=$(echo "$FIREBASE_TOKEN" | base64 -d 2>/dev/null || true) && [[ "$decoded" == *"service_account"* ]]; then
              echo "Detected base64 service account JSON in FIREBASE_TOKEN secret. Deploying via GOOGLE_APPLICATION_CREDENTIALS..."
              echo "$decoded" > service-account.json
              trap 'rm -f service-account.json' EXIT
              GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/service-account.json npx -y firebase-tools@latest deploy --only hosting --project incasters --non-interactive
            else
              echo "Deploying to Firebase Hosting via FIREBASE_TOKEN (OAuth token)..."
              npx -y firebase-tools@latest deploy --only hosting --token "$FIREBASE_TOKEN" --project incasters --non-interactive
            fi
          else
            echo "::warning::No Firebase credentials found in repository secrets (FIREBASE_SERVICE_ACCOUNT_INCASTERS, FIREBASE_SERVICE_ACCOUNT, or FIREBASE_TOKEN). Skipping live deployment."
          fi

      - name: Deploy to Firebase Hosting Preview Channel (Pull Requests)
        if: github.event_name == 'pull_request'
        env:
          FIREBASE_SERVICE_ACCOUNT_INCASTERS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INCASTERS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          CHANNEL_NAME="pr-${{ github.event.pull_request.number }}"
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_INCASTERS" ]; then
            echo "Deploying preview channel $CHANNEL_NAME via FIREBASE_SERVICE_ACCOUNT_INCASTERS..."
            echo "$FIREBASE_SERVICE_ACCOUNT_INCASTERS" > service-account.json
            trap 'rm -f service-account.json' EXIT
            GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/service-account.json npx -y firebase-tools@latest hosting:channel:deploy "$CHANNEL_NAME" --expires 7d --project incasters --non-interactive
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Deploying preview channel $CHANNEL_NAME via FIREBASE_SERVICE_ACCOUNT..."
            echo "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
            trap 'rm -f service-account.json' EXIT
            GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/service-account.json npx -y firebase-tools@latest hosting:channel:deploy "$CHANNEL_NAME" --expires 7d --project incasters --non-interactive
          elif [ -n "$FIREBASE_TOKEN" ]; then
            if [[ "$FIREBASE_TOKEN" == *"service_account"* || "$FIREBASE_TOKEN" == *"private_key"* ]]; then
              echo "Detected service account JSON in FIREBASE_TOKEN secret. Deploying preview channel $CHANNEL_NAME via GOOGLE_APPLICATION_CREDENTIALS..."
              echo "$FIREBASE_TOKEN" > service-account.json
              trap 'rm -f service-account.json' EXIT
              GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/service-account.json npx -y firebase-tools@latest hosting:channel:deploy "$CHANNEL_NAME" --expires 7d --project incasters --non-interactive
            elif decoded=$(echo "$FIREBASE_TOKEN" | base64 -d 2>/dev/null || true) && [[ "$decoded" == *"service_account"* ]]; then
              echo "Detected base64 service account JSON in FIREBASE_TOKEN secret. Deploying preview channel $CHANNEL_NAME via GOOGLE_APPLICATION_CREDENTIALS..."
              echo "$decoded" > service-account.json
              trap 'rm -f service-account.json' EXIT
              GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/service-account.json npx -y firebase-tools@latest hosting:channel:deploy "$CHANNEL_NAME" --expires 7d --project incasters --non-interactive
            else
              echo "Deploying preview channel $CHANNEL_NAME via FIREBASE_TOKEN..."
              npx -y firebase-tools@latest hosting:channel:deploy "$CHANNEL_NAME" --expires 7d --token "$FIREBASE_TOKEN" --project incasters --non-interactive
            fi
          else
            echo "::warning::No Firebase credentials found for PR preview deployment. Skipping."
          fi

  publish-release:
    name: Publish Combined GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-windows
      - deploy-firebase
    if: github.event_name != 'pull_request' && needs.build-android.result == 'success' && needs.build-windows.result == 'success' && needs.deploy-firebase.result == 'success'

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Incasters-Android
          path: release-assets

      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: Incasters-Android-AAB
          path: release-assets

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: Incasters-Windows
          path: release-assets

      - name: Download Web Distribution ZIP
        uses: actions/download-artifact@v4
        with:
          name: Incasters-Web
          path: release-assets

      - name: Verify Release Assets
        run: |
          test -f release-assets/Incasters-Android.apk
          test -f release-assets/Incasters-Android.aab
          test -f release-assets/Incasters-Windows-x64.exe
          test -f release-assets/Incasters-Web.zip
          ls -lh release-assets

      - name: Create GitHub Release with Android, Windows & Web Builds
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Incasters v1.0.{0} (Release)', github.run_number) }}
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
          files: |
            release-assets/Incasters-Android.apk
            release-assets/Incasters-Android.aab
            release-assets/Incasters-Windows-x64.exe
            release-assets/Incasters-Web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
